<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b12; color: #f2f2f8; font-family: "Segoe UI", system-ui, sans-serif; text-align: center; }
  main { max-width: 420px; padding: 24px; display: grid; gap: 14px; justify-items: center; }
  .mark { width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(135deg, #7c5cff, #22d3ee); }
  p { color: #a4a4b8; margin: 0; line-height: 1.5; }
  button { margin-top: 6px; padding: 12px 28px; border: 0; border-radius: 999px; font-size: 16px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #7c5cff, #3b82f6); cursor: pointer; }
  small { color: #7d7d92; }
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>Can’t reach Nexora</h1>
  <p>Check your internet connection. Your downloaded songs are saved inside the app and will play again as soon as it connects.</p>
  <button id="retry">Try again</button>
  <small id="where"></small>
</main>
<script>
  const to = new URLSearchParams(location.search).get('to') || '';
  document.getElementById('where').textContent = to;
  const go = () => { if (to) location.href = to; };
  document.getElementById('retry').addEventListener('click', go);
  addEventListener('online', go);
  setInterval(() => { if (navigator.onLine) go(); }, 15000);
</script>
</body>
</html>
